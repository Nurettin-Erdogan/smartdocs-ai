name: CodeQL güvenlik analizi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "31 4 * * 1"

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: ${{ matrix.language }} analizi
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        language: [csharp, javascript-typescript]
    steps:
      - name: Kodu al
        uses: actions/checkout@v6

      - name: CodeQL'yi başlat
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Güvenlik analizini çalıştır
        uses: github/codeql-action/analyze@v4
