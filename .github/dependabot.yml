version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-minor-ve-yama:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: nuget
    directories:
      - /backend/SmartDocsAI.API
      - /tests/SmartDocsAI.API.Tests
    schedule:
      interval: weekly
    groups:
      nuget-minor-ve-yama:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      # Bu paketlerin büyük sürümleri .NET ana sürümüne bağlı; proje .NET 10 LTS'de kalıyor.
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.AspNetCore.*"
        update-types:
          - version-update:semver-major
      - dependency-name: "Microsoft.OpenApi"
        update-types:
          - version-update:semver-major
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Proje .NET 10 LTS hedefliyor; .NET 11 imajları net10.0 uygulamasını çalıştırmaz.
      - dependency-name: "dotnet/*"
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
